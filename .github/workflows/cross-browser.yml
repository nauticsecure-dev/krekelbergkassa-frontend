name: Desktop browser compatibility

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run install:cross-browser
      - name: Install branded Chrome and Edge
        run: npx playwright install chrome msedge
      - run: npm run test:cross-browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results-${{ matrix.os }}
          path: test-results/cross-browser/
          retention-days: 14
